  <text x="640" y="68" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Unclassified open-source vocabulary · Not a basing map · For SE context / interfaces / CONOPS discussion</text>

  <!-- ===== AIR / SPACE BAND ===== -->
  <text x="40" y="105" fill="#64748b" font-family="Segoe UI, Arial" font-size="11" font-weight="600" letter-spacing="1">AIR / SPACE</text>

  <!-- Threat bubble -->
