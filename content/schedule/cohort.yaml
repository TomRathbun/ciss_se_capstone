  - id: w1-mon
    week: 1
    day: Monday
    title: SE — What SE is
    modules: [se-f01-what-se-is]
    type: lecture_workshop
    assignment_assigned: [se-fa01-what-se-is, se-fa00-professional]
  - id: w1-tue
    week: 1
    day: Tuesday
    title: NET — How a network is built
    modules: [net-f01-how-built]
    type: lecture_workshop
    assignment_due: [se-fa01-what-se-is]
    assignment_assigned: [net-fa01-how-built]
  - id: w1-wed
    week: 1
    day: Wednesday
    title: SW — Git as daily craft
    modules: [sw-f01-git]
    type: lecture_workshop
    assignment_due: [net-fa01-how-built]
    assignment_assigned: [sw-fa01-git]
  - id: w1-thu
    week: 1
    day: Thursday
    title: ADMIN — Linux on a VM
    modules: [admin-f01-linux-vm]
    type: lecture_workshop
    assignment_due: [sw-fa01-git]
    assignment_assigned: [admin-fa01-linux-vm]
