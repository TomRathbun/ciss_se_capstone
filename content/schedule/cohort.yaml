# Default cohort rhythm: Monday deep session, Thursday Q&A / grade
# Instructor can skip lecture weeks and insert ops-only or project weeks.
#
# One SE module per Monday (Week 1 pairs welcome + what-is-SE).
# Thursday is the check for that week's take-home.
# Software, Networking, and SysAdmin tracks run their own module order
# in parallel (NET: net-00-welcome … net-10-troubleshoot on older Juniper).

cohort_id: 2026-UAE-interns
timezone: Asia/Dubai
pattern: >
  Typical week: Monday 3–4h introduce one SE module + workshop.
  Thursday shorter: questions, peer review, grading of that week's assignment.
  Military ops weeks sit after the SE spine (V&V), then the ETAS walk and SA preview.

sessions:
  - id: w1-mon
    week: 1
    day: Monday
    title: Kickoff — Welcome, selection, what SE is
    modules: [se-00-welcome, se-01-what-is-se]
    type: lecture_workshop
    assignment_assigned: [se-a00-track-plan, se-a01-se-literacy]

  - id: w1-thu
    week: 1
    day: Thursday
    title: Q&A — SE-A00 + SE-A01 due
    modules: [se-00-welcome, se-01-what-is-se]
    type: qa_grade
    assignment_due: [se-a00-track-plan, se-a01-se-literacy]

  - id: w2-mon
    week: 2
    day: Monday
    title: Vision, stakeholders & needs
    modules: [se-02-stakeholders]
