# CISS intern cohort — Monday deep session, Thursday Q&A / grade.
# Instructor can skip lecture weeks and insert ops-only or project weeks.
#
# Model (this is a multi-track course, not SE-only):
#   Weeks 1–9   each intern is in ONE discipline room (SE / SW / NET / ADMIN)
#   Weeks 10–11 MILITARY is COMMON — every intern, every track
#   Weeks 12–13 leftover discipline modules + SE living case (others may sit in)
#   Weeks 14–18 PRSAS capstone — all tracks in the same problem
#
# Session `audience`:
#   track — intern attends their primary-track lane only
#   all   — everyone in the room (military + PRSAS kickoff / demo)
#
# Lanes are keyed by catalog track id (se, sw, net, admin, mil).

cohort_id: 2026-UAE-interns
timezone: Asia/Dubai
tracks_in_parallel: [se, sw, net, admin]
common_track: mil
pattern: >
  Typical week: Monday 3–4h introduce that track’s module + workshop.
  Thursday shorter: questions, peer review, grading of that week’s assignment.
  Four discipline tracks run in PARALLEL (an intern is in one room).
  Military ops weeks (10–11) are COMMON to every intern regardless of track.
  PRSAS (14–18) is a joint capstone; each track still owns its artifacts.

sessions:
  # ---------- Week 1 — kickoff ----------
  - id: w1-mon
    week: 1
    day: Monday
    title: Discipline kickoff
    type: lecture_workshop
    audience: track
    lanes:
