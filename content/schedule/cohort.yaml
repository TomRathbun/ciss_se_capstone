# Masdar afternoon model. One LM SME from the SDC (Al Dhafra) each weekday.
# Morning at Masdar: intern work on yesterday's assignment (~2 hours).
# Afternoon: lecture / review / exercise / assign.
# Friday is flex (SE workshop, integration, or TAA-cleared military).
# SDC on-site after week 24 is not in this calendar until approvals exist.

cohort_id: 2026-UAE-interns
timezone: Asia/Dubai
pattern: >
  Morning: intern work on the assignment from yesterday's discipline (~2 hours), due before
  that day's afternoon lecture. Afternoon: one SME teaches (Mon SE, Tue NET, Wed SW,
  Thu Admin, Fri flex). Weeks 1–4 all-hands. Week 5 capstone kickoff (all-hands).
  Week 6+ electives; SE remains mandatory. Military lectures only after TAA review.

sessions:
