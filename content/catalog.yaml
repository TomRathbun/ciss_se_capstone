# CISS Capstone — multi-track curriculum catalog
# Tracks group modules and assignments. Authors add content under content/modules/
# and content/assignments/, then register ids here with track + order.

course:
  title: CISS Capstone
  subtitle: Multi-track intern pathway — SE · Software · Networking · SysAdmin · Military
  purpose: >
    Prepare and assess interns for selection onto the main CISS engineering project.
    Each discipline track (systems engineering, software development, networking,
    system administration/integration, and military operations) can grow its own
    modules and graded assignments. Scores distinguish top performers.

# Canonical tracks. Module/assignment `track` field must match an id below
# (legacy catalog value `ops` is accepted as an alias for `mil`).
tracks:
  - id: se
    order: 1
    short: SE
    title: Systems Engineering
    summary: Vision → needs → use cases → requirements → architecture → behavior → ICDs → V&V → PRSAS implementation.
    color: se
    status: active

  - id: sw
    order: 2
    short: SW
    title: Software Development
    summary: Git and workflow; Python→Java bridge; Java (JDBC, ActiveMQ, daemons, JavaFX) and Jenkins; PRSAS simulator, daemon, and SA client.
    color: sw
    status: active

  - id: net
    order: 3
    short: NET
    title: Networking
    summary: General networking, then older Juniper (EX, SRX, IPsec, OSPF/BGP, MPLS); PRSAS three-site fabric and tunnels.
    color: net
    status: active

  - id: admin
    order: 4
    short: ADMIN
    title: System Administration & Integration
    summary: RHEL/Linux, bash, packages, TLS, IDM, NFS, vSphere, Postgres, tickets; PRSAS VM, IPA/CA, harden/Ansible.
    color: admin
    status: active

  - id: mil
    order: 5
    short: MIL
    title: Military Operations
    summary: UAE military context, CONOPS/AOC, ATO planning & execution, platforms; PRSAS operator picture.
    color: mil
    status: active

modules:
  - id: se-00-welcome
    order: 1
    track: se
    title: Welcome & How This Course Works
    duration_min: 45
    summary: Course purpose, learning objectives, selection rubric, Monday/Thursday rhythm, SE tool literacy (artifacts first, simplest clear tool), overview activities, and where diagrams fit.
    offline: false

  - id: se-01-what-is-se
    order: 2
    track: se
    title: What Is Systems Engineering?
    duration_min: 90
    summary: Vision → needs → use cases → requirements → design with derives_from / traces_to / allocated_to links; why SE matters; aerospace history cases.
    offline: true

  - id: se-02-stakeholders
    order: 3
    track: se
    title: Vision, Stakeholders & Needs
    duration_min: 120
    summary: Vision statement for shared perspective; stakeholders; needs grammar (As… we need… so that…); context & scope.
    offline: true

  - id: se-03-usecases
    order: 4
    track: se
    title: Use Cases from Needs
    duration_min: 90
    summary: Derive use cases from needs; actors, main success scenario, extensions; bridge to EARS requirements.
    offline: true

  - id: se-04-requirements
    order: 5
    track: se
    title: Requirements & Acceptance Criteria
    duration_min: 120
    summary: Shall language, EARS grammar, IDs, NFRs, ACs that prove FRs without papering over vague shalls.
    offline: true

  - id: se-05-architecture
    order: 6
    track: se
    title: Architecture Views
    duration_min: 120
    summary: Diagram catalog (context, container, component, deployment, package, data); FR allocation; design decisions; brief MBSE/framework awareness.
    offline: true

  - id: se-06-behavior
    order: 7
    track: se
    title: Behavior — States & Sequences
    duration_min: 150
    summary: State vs status; state syntax (trigger/guard/activity); EARS→state mapping; hierarchical states; sequence diagrams.
    offline: true

  - id: se-07-interfaces
    order: 8
    track: se
    title: Interfaces & ICDs
    duration_min: 120
    summary: Messaging ICDs (content, Tx/Rx, rates; ASTERIX Cat062) vs API ICDs (REST ops, params, errors); file ICDs; partial examples.
    offline: true

  - id: se-11-mbse-frameworks
    order: 9
    track: se
    title: Architecture Frameworks & MBSE Literacy
    duration_min: 90
    summary: MBSE vs documents; UML vs SysML; DoDAF/MODAF/NAF/UAF; map course artifacts to OV/SV-style products.
    offline: true

  - id: se-08-vv-trace
    order: 10
    track: se
    title: Verification, Validation & Traceability
    duration_min: 90
    summary: Verify vs validate; requirement → design → test; building a trace matrix.
    offline: true

  - id: se-09-case-etas
    order: 11
    track: se
    title: Case Study — SDC Time Tracker (ETAS)
    duration_min: 120
    summary: Walk the living system and its SE artifacts; connect FR-IDs to real code and export.
    offline: false

  - id: ops-uae-military
    order: 12
    track: mil
    title: UAE Military Context (Open Source)
    duration_min: 90
    summary: UAE Armed Forces branches, leadership, ranks, platforms, SHORAD/layered AD, and radar families (open source).
    offline: true

  - id: ops-00-conops-aoc
    order: 13
    track: mil
    title: Military Ops — CONOPS & Air Operations Center
    duration_min: 120
    summary: CONOPS & AOC with glossary, detect-to-assess workflow, VCS/Link16, roles, self-check, and SE-linked scenario. SME lecture.
    offline: true

  - id: ops-01-ato-planning
    order: 14
    track: mil
    title: Military Ops — Air Tasking Order (Planning)
    duration_min: 150
    summary: ATO planning vs execution; planning factors; sample mission card; self-check; starts A5.
    offline: true

  - id: ops-02-ato-execution
    order: 15
    track: mil
    title: Military Ops — ATO Execution
    duration_min: 150
    summary: Execution steps, change drivers, state-chart parallel, annex/AAR templates, self-check.
    offline: true

  - id: ops-03-weapons-context
    order: 16
    track: mil
    title: Weapons & Platforms Context (Lockheed Heritage)
    duration_min: 90
    summary: Public platform/weapon vocabulary for mission cards; integrity rules; one-page brief; self-check.
    offline: true

  - id: se-10-capstone-preview
    order: 17
    track: se
    title: Capstone Preview — Radar Situational Awareness
    duration_min: 90
    summary: Frame a two-feed unclassified SA problem with the full SE chain; SE-A10 starter pack (not a placeholder teaser).
    offline: false

  # --- Software Development ---
  - id: sw-00-welcome
    order: 20
    track: sw
    title: Software Development — Track Overview
    duration_min: 45
    summary: Program tooling map; Python is an on-ramp; Java is the contract language; path through Git, Java, data, ActiveMQ, daemons, JavaFX.
    offline: false

  - id: sw-01-git
    order: 21
    track: sw
    title: Working with Git
    duration_min: 90
    summary: Daily Git loop, DR-### branch names, commits, recovery commands, team history habits.
    offline: true

  - id: sw-02-bitbucket-jira
    order: 22
    track: sw
    title: Team Workflow — Jira, Bitbucket, Nexus → GitLab
    duration_min: 90
    summary: Program DR/Bitbucket/PR/Nexus workflow; translate and practice the same habits on CISS GitLab MRs.
    offline: false

  - id: sw-03-python-java
    order: 23
    track: sw
    title: From Python to Java
    duration_min: 90
    summary: Python as a translation aid only; types, equals, packages, Maven vs pip; hiring bar is Java for the contract.
    offline: true

  - id: sw-03-vscode-java
    order: 24
    track: sw
    title: VS Code for Java Development
    duration_min: 90
    summary: Recommended Java extensions; Java versions (LTS, OpenJDK vs Oracle, JDK/JRE, licenses); Java 8 baseline + upgrade path; Spring/Spring Boot note; Maven projects, run/debug, navigation.
    offline: true

  - id: sw-04-java-postgresql
    order: 25
    track: sw
    title: PostgreSQL with Java (JDBC)
    duration_min: 120
    summary: JDBC, PreparedStatement, transactions; connection pools (HikariCP); JBoss datasources in standalone.xml and JNDI; trade-offs.
    offline: true

  - id: sw-05-java-amqp
    order: 26
    track: sw
    title: AMQP Messaging with Java (ActiveMQ)
    duration_min: 120
    summary: JMS publish/consume; ConnectionFactory and pooling; JBoss resource adapters / JNDI factories; ack modes; ICD-style payloads; trade-offs.
    offline: true

  - id: sw-06-java-daemons
    order: 27
    track: sw
    title: Java Daemons and Background Services
    duration_min: 120
    summary: Long-running workers, lifecycle/shutdown hooks, hosting ActiveMQ consumers and scheduled jobs.
    offline: true

  - id: sw-07-javafx-gui
    order: 28
    track: sw
    title: JavaFX for Desktop GUIs
    duration_min: 120
    summary: Stages/scenes/layouts, controls and events, FXML option, UI-thread safety, thin UI over services.
    offline: true

  - id: sw-08-jenkins-cicd
    order: 29
    track: sw
    title: CI/CD and Jenkins
    duration_min: 120
    summary: CI/CD concepts; Jenkins jobs/pipelines; build-test-publish to Nexus; mapping to GitLab CI for CISS labs.
    offline: false

  # --- Networking (older Juniper / Junos intern path) ---
  - id: net-00-welcome
    order: 30
    track: net
    title: Networking — Track Overview
    duration_min: 45
    summary: General networking then Juniper intern path on older EX/SRX/PE; shared fabric; commit discipline; links to SE, admin, and military.
    offline: false

  - id: net-01-general
    order: 31
    track: net
    title: General Networking
    duration_min: 120
    summary: Vendor-neutral LAN/WAN, device roles, layers, DHCP/DNS, default gateway, NAT, common ports, test order.
    offline: true

  - id: net-01-foundations
    order: 32
    track: net
    title: Network Foundations
    duration_min: 120
    summary: OSI/TCP-IP, IPv4/CIDR, Ethernet/VLAN/ARP, TCP vs UDP, ping and traceroute as tests.
    offline: true

  - id: net-02-junos-cli
    order: 33
    track: net
    title: Junos CLI and the Commit Model
    duration_min: 120
    summary: RE vs PFE; candidate vs active; set/display set; commit check/confirmed/rollback; older EX/SRX interface names.
    offline: true

  - id: net-03-switching
    order: 34
    track: net
    title: EX Switching — VLANs, Trunks, and Virtual Chassis
    duration_min: 120
    summary: Access vs trunk on older EX (port-mode vs ELS); RSTP; EX4200 Virtual Chassis; handoff to the SRX.
    offline: true

  - id: net-04-srx-firewall
    order: 35
    track: net
    title: SRX Firewalls — Zones, Policies, and NAT
    duration_min: 150
    summary: Older SRX families; zones; host-inbound-traffic; first-match policy; source NAT; flow sessions.
    offline: true

  - id: net-05-igp-ospf
    order: 36
    track: net
    title: Interior Routing — Static Routes and OSPF
    duration_min: 120
    summary: show route and preference; statics; OSPF area 0, neighbors, lo0; IGP as a gate for BGP/MPLS.
    offline: true

  - id: net-06-bgp
    order: 37
    track: net
    title: BGP — External and Internal
    duration_min: 150
    summary: eBGP vs iBGP; neighbor states; Junos policy-statement export; local-pref, AS-path, next-hop-self.
    offline: true

  - id: net-07-mpls
    order: 38
    track: net
    title: MPLS Tunnels — LDP, RSVP-TE, and L3VPN
    duration_min: 150
    summary: LSPs as tunnels; LDP vs RSVP-TE; inet.3; VRF/RD/RT; branch SRX as CE not PE.
    offline: true

  - id: net-08-encryptors
    order: 39
    track: net
    title: Encryptors and IPsec
    duration_min: 120
    summary: Route-based st0 IPsec on older SRX; proxy-IDs; red/black discipline; dedicated inline encryptor awareness.
    offline: true

  - id: net-09-ha-change
    order: 40
    track: net
    title: HA and Change Control
    duration_min: 90
    summary: commit confirmed, rescue, rollback; SRX chassis cluster vocabulary; EX VC split; change tickets.
    offline: true

  - id: net-10-troubleshoot
    order: 41
    track: net
    title: Network Troubleshooting on Junos
    duration_min: 120
    summary: Layered method; Junos show/monitor evidence packs; avoid traceoptions and blast-radius clears on old boxes.
    offline: true

  # --- System Administration & Integration ---
  - id: admin-00-welcome
    order: 40
    track: admin
    title: System Administration & Integration — Track Overview
    duration_min: 45
    summary: Admin track path — RHEL, bash, packages, TLS, IDM, NFS, vSphere, Postgres, troubleshooting, tickets; bridge from software builds to running systems.
    offline: false

  - id: admin-01-rhel7-linux
    order: 41
    track: admin
    title: RHEL 7 and Essential Linux Commands
    duration_min: 120
    summary: Filesystem, processes, users, network discovery, systemctl/journalctl, SELinux/firewall awareness.
    offline: true

  - id: admin-02-bash
    order: 42
    track: admin
    title: Bash Programming for Admins
    duration_min: 120
    summary: Scripts, quoting, args, conditionals, loops, set -euo pipefail, safe admin patterns.
    offline: true

  - id: admin-03-package-management
    order: 43
    track: admin
    title: Package Management Systems
    duration_min: 120
    summary: yum/rpm, npm, pip and uv, Maven/Java, and Nexus as org package hub.
    offline: true

  - id: admin-04-tls-certs
    order: 44
    track: admin
    title: TLS Certificate Management
    duration_min: 120
    summary: Certs, keys, CSRs, chains, OpenSSL inspect/verify, trust stores, common TLS failures.
    offline: true

  - id: admin-05-idm-ad-ipa
    order: 45
    track: admin
    title: Identity Management — Active Directory and FreeIPA
    duration_min: 120
    summary: Central identity; AD vs FreeIPA; SSSD/realm; Kerberos; groups, HBAC, sudo; login troubleshooting.
    offline: true

  - id: admin-06-nfs
    order: 46
    track: admin
    title: NFS Setup and Configuration
    duration_min: 120
    summary: Exports and mounts; NFSv3/v4; UID mapping; firewall; Kerberos-aware shares; showmount/exportfs.
    offline: true

  - id: admin-07-vsphere-vsan-vdi
    order: 47
    track: admin
    title: vSphere, vSAN, VDI, and ESXi
    duration_min: 120
    summary: ESXi/vCenter vocabulary; VM lifecycle; datastores and vSAN; port groups; VDI awareness; snapshot discipline.
    offline: true

  - id: admin-08-postgres-admin
    order: 48
    track: admin
    title: PostgreSQL Database Management for Admins
    duration_min: 120
    summary: Roles and databases; admin SQL (activity, size, locks); grants; vacuum; backup/restore awareness.
    offline: true

  - id: admin-09-troubleshooting
    order: 49
    track: admin
    title: Troubleshooting Methodology and Essential Tools
    duration_min: 120
    summary: Symptom→hypothesis→test method; deep dive on grep, tail, less, journalctl, ps aux, ss; evidence packs.
    offline: true

  - id: admin-10-documentation-tickets
    order: 50
    track: admin
    title: Documentation Procedures and Trouble Tickets
    duration_min: 90
    summary: Ticket anatomy; incident vs change vs request; runbooks; evidence standards; resolution notes.
    offline: true

  # --- PRSAS implementation (UC-CISS_PROJECT-001) — scored in phase: capstone ---
  - id: se-12-prsas-overview
    order: 18
    track: se
    phase: capstone
    title: PRSAS Implementation — Shared Kickoff
    duration_min: 90
    summary: UC-CISS_PROJECT-001 three-site picture; role map; frozen topics, ports, and CISS-TEACH-1 payload. All tracks attend.
    offline: false

  - id: se-13-prsas-conops
    order: 19
    track: se
    phase: capstone
    title: PRSAS CONOPS
    duration_min: 120
    summary: Operational concept for the lab air picture — stakeholders, mission threads, unwanted paths, in/out of scope.
    offline: true

  - id: se-14-prsas-mbse-schema
    order: 20
    track: se
    phase: capstone
    title: PRSAS MBSE Artifacts & Track Schema
    duration_min: 150
    summary: Sequence, hybrid track lifecycle, logical components, FR allocation, PostgreSQL schema with Mode 3/A key.
    offline: true

  - id: se-15-prsas-virt-lessons
    order: 21
    track: se
    phase: capstone
    title: PRSAS Virtualization Study & Lessons-Learned
    duration_min: 120
    summary: VM baseline vs two-component container PoC; measured comparison; close-out report and migration verdict.
    offline: false

  - id: sw-09-prsas-simulator
    order: 51
    track: sw
    phase: capstone
    title: PRSAS — Radar Message Simulator
    duration_min: 150
    summary: Java ASTERIX-like Cat 062 publisher (CISS-TEACH-1) on sim-a/sim-b; scenarios, throttle, TLS JMS to radar.input.
    offline: true

  - id: sw-10-prsas-daemon
    order: 52
    track: sw
    phase: capstone
    title: PRSAS — Track Processing Daemon
    duration_min: 180
    summary: systemd Java worker — correlate on Mode 3/A, coast/drop/conflict, JDBC persist, publish radar.output.
    offline: true

  - id: sw-11-prsas-client
    order: 53
    track: sw
    phase: capstone
    title: PRSAS — Situational Awareness Client
    duration_min: 180
    summary: Authenticated JavaFX or web+Java bridge; bulk load; live topic; map with Mode 3/A, vectors, trails, conflict.
    offline: true

  - id: sw-12-prsas-integrate
    order: 54
    track: sw
    phase: capstone
    title: PRSAS — Integration & Container PoC
    duration_min: 150
    summary: End-to-end test card across three stacks; containerize sim + daemon; numbers for the SE virt study.
    offline: false

  - id: net-11-prsas-topology
    order: 55
    track: net
    phase: capstone
    title: PRSAS — Three-Site Topology
    duration_min: 120
    summary: Remote A / Remote B / Central VLANs and addressing; EX/SRX placement; allow-list intent.
    offline: true

  - id: net-12-prsas-secure-path
    order: 56
    track: net
    phase: capstone
    title: PRSAS — Firewalls & Site-to-Site IPsec
    duration_min: 150
    summary: SRX zones and least-privilege policies; two route-based IPsec tunnels onto Central.
    offline: true

  - id: net-13-prsas-validate
    order: 57
    track: net
    phase: capstone
    title: PRSAS — Path Validation & Config Guide
    duration_min: 120
    summary: Layered proof that 61617 works; negative tests; replayable network configuration guide.
    offline: true

  - id: admin-11-prsas-provision
    order: 58
    track: admin
    phase: capstone
    title: PRSAS — VM Provisioning
    duration_min: 120
    summary: Golden image and guest inventory on the correct port groups; snapshot discipline.
    offline: true

  - id: admin-12-prsas-idm-certs
    order: 59
    track: admin
    phase: capstone
    title: PRSAS — Identity & Lab Certificates
    duration_min: 150
    summary: FreeIPA/OpenLDAP principals; lab CA; AMQ TLS certs and trust bundles.
    offline: true

  - id: admin-13-prsas-harden-automate
    order: 60
    track: admin
    phase: capstone
    title: PRSAS — Host Hardening & Deployment Automation
    duration_min: 150
    summary: firewalld + SELinux + auditd aligned to the allow-list; Ansible or PowerCLI rebuild.
    offline: true

  - id: ops-04-prsas-picture
    order: 61
    track: mil
    phase: capstone
    title: PRSAS — Air Picture for Operators
    duration_min: 90
    summary: Unclassified fused-picture literacy; watch script; supervisor conflict disposition; demo voice.
    offline: true


assignments:
  # SE take-homes: one per module, Monday assign / Thursday check. Weights sum to 100%.
  # A3b / A3c / A7c remain as in-class workshop briefs under content/assignments/ (not separately weighted).
  - id: se-a00-track-plan
    order: 1
    track: se
    title: SE Track Plan & Artifact Map
    module_id: se-00-welcome
    due_session: "Week 1 Thursday"
    weight: 3
    summary: Personal plan, artifact/tool map, design-first trap, integrity habits.
    rubric:
      - dimension: completeness
        max_points: 10
        description: Plan + map + trap story + integrity
      - dimension: accuracy
        max_points: 10
        description: Correct chain order and module mapping
      - dimension: communication
        max_points: 5
        description: Peer could follow your plan

  - id: se-a01-se-literacy
    order: 2
    track: se
    title: What Is SE? Failure-Mode Brief
    module_id: se-01-what-is-se
    due_session: "Week 1 Thursday"
    weight: 5
    summary: SE definition, daily-app chain walk, public failure mapped to a missing artifact.
    rubric:
      - dimension: literacy
        max_points: 10
        description: Accurate SE definition and chain
      - dimension: case_analysis
        max_points: 10
        description: Failure mapped to a real missing artifact
      - dimension: communication
        max_points: 5
        description: Tables a peer can grade in 5 minutes

  - id: a1-context
    order: 3
    track: se
    title: Vision, Context & Stakeholders
    module_id: se-02-stakeholders
    due_session: "Week 2 Thursday"
    weight: 10
    summary: Short vision, needs grammar, context diagram, stakeholder table.
    rubric:
      - dimension: completeness
        max_points: 10
        description: Vision + needs grammar; major actors and external systems identified
      - dimension: boundary_clarity
        max_points: 10
        description: Clear in-scope / out-of-scope; vision/need/design not mixed
      - dimension: communication
        max_points: 5
        description: Readable by a non-author engineer; shared perspective is clear

  - id: se-a03-usecases
    order: 4
    track: se
    title: Use Cases from Needs
    module_id: se-03-usecases
    due_session: "Week 3 Thursday"
    weight: 8
    summary: UC index, two full briefs with extensions, rejected UC, trace table.
    rubric:
      - dimension: derivation
        max_points: 15
        description: UCs clearly traces_to named needs; vision check present
      - dimension: completeness
        max_points: 10
        description: Index + 2 full briefs + reject + trace table
      - dimension: communication
        max_points: 5
        description: A peer could write EARS from your extensions

  - id: a2-requirements
    order: 5
    track: se
    title: Requirements Pack (EARS + acceptance)
    module_id: se-04-requirements
    due_session: "Week 5 Thursday"
    weight: 16
    summary: 8–12 FRs in EARS form, 3 NFRs with IDs; 5 ACs in Given/When/Then form.
    rubric:
      - dimension: testability
        max_points: 15
        description: Requirements and ACs are objectively testable; ACs prove FRs without adding hidden rules
      - dimension: shall_quality
        max_points: 10
        description: Correct EARS and shall; FR stands alone without needing the AC to explain it
      - dimension: coverage
        max_points: 10
        description: WHEN + WHILE + IF/THEN represented; happy path and key errors
      - dimension: communication
        max_points: 5
        description: Clear IDs, pattern tags, and structure

  - id: se-a05-architecture
    order: 6
    track: se
    title: Architecture Views & Allocation
    module_id: se-05-architecture
    due_session: "Week 5 Thursday"
    weight: 8
    summary: Context, structure, deployment (VMs); FR allocation; one design decision.
    rubric:
      - dimension: views
        max_points: 15
        description: Distinct context + structure + deployment
      - dimension: allocation
        max_points: 10
        description: FRs mapped to real elements; decision recorded
      - dimension: communication
        max_points: 5
        description: Peer can brief the structure in 3 minutes

  - id: a3-behavior
    order: 7
    track: se
    title: State Chart + Sequence (your feature)
    module_id: se-06-behavior
    due_session: "Week 6 Thursday"
    weight: 10
    summary: One state machine and one sequence for a chosen feature; FR mapping; reject paths.
    rubric:
      - dimension: correctness
        max_points: 15
        description: Legal/illegal transitions and messages make sense
      - dimension: consistency
        max_points: 10
        description: Aligns with stated requirements; chart and sequence agree
      - dimension: communication
        max_points: 5
        description: Labels readable; legend if needed

  - id: a7-icd-messaging-api
    order: 8
    track: se
    title: Messaging ICD + API ICD (partial)
    module_id: se-07-interfaces
    due_session: "Week 7 Thursday"
    weight: 8
    summary: Partial messaging ICD (content, Tx/Rx, rates) and partial REST API ICD (ops, params, errors).
    rubric:
      - dimension: messaging_completeness
        max_points: 10
        description: Content + Tx/Rx + rates present and coherent
      - dimension: api_completeness
        max_points: 10
        description: Operations + detailed op + errors present
      - dimension: communication
        max_points: 5
        description: Tables readable; version/owner clear

  - id: se-a11-mbse-literacy
    order: 9
    track: se
    title: Frameworks & MBSE Literacy Brief
    module_id: se-11-mbse-frameworks
    due_session: "Week 8 Thursday"
    weight: 5
    summary: MBSE vs documents; UML vs SysML; map your artifacts to OV/SV-style products.
    rubric:
      - dimension: literacy
        max_points: 10
        description: MBSE / UML / SysML / framework idea is correct
      - dimension: mapping
        max_points: 10
        description: Your real artifacts mapped, not generic slogans
