terms:
  - term: System
    definition: A combination of interacting elements organized to achieve one or more stated purposes.
  - term: Systems Engineering (SE)
    definition: Interdisciplinary approach to enable the realization of successful systems — balancing need, requirements, design, integration, and verification.
  - term: Stakeholder
    definition: Person or organization with an interest in the system (user, operator, acquirer, maintainer, regulator).
  - term: Vision statement
    definition: A shared description of the desired future state of a system or program phase, often with guiding principles — used to align stakeholders before needs and requirements.
  - term: Key principle (vision)
    definition: A standing rule of the vision (e.g. hybrid AI, human-in-the-loop, MOSA/open standards) that guides trades and later requirements.
  - term: Operational need
    definition: The problem or capability gap in the real world that motivates building a system — expressed for a stakeholder with a benefit; derived from vision.
  - term: Needs statement (course grammar)
    definition: "Fixed form: As <stakeholder>, we need <the need>, so that <benefit>. Captures who, what capability, and why — not system shall-language."
  - term: Use case
    definition: A goal-oriented interaction between an actor and the system that delivers part of a need; includes main success scenario and extensions (failures/alternates).
  - term: Derivation chain (this course)
    definition: >
      Vision → Needs → Use cases → Requirements (EARS) → Design, linked with typed relationships
      (not a vague "refine"): system vision derives_from global vision (when both exist);
      need derives_from vision; need traces_to use case; use case allocated_to requirement;
      requirement allocated_to design.
  - term: derives_from
    definition: >
      Link from a more specific artifact to its parent justification — e.g. phase/system vision
      derives_from global vision; need derives_from vision (or a vision principle).
  - term: traces_to
    definition: >
      Link from a need to the use case(s) that realize it (need traces_to use case). Part of
      the forward chain; full traceability also walks links backward to vision and forward to tests.
  - term: allocated_to
    definition: >
      Link that places responsibility: use case allocated_to requirement(s); requirement
      allocated_to design element(s). If you cannot allocate, the architecture or the FR is incomplete.
  - term: Stakeholder (in a need)
    definition: The role or unit named after "As …" — owner of the need (e.g. UAE AFAD Mission Operators, FOSC program administrators).
  - term: Benefit (in a need)
    definition: The "so that …" clause — mission or business outcome that validates success with that stakeholder.
  - term: Requirement
    definition: A formal statement of what the system shall do or a constraint it shall satisfy (not how to implement it). Derived from needs; written with shall / EARS in this course.
  - term: Shall
    definition: Mandatory requirement language. Avoid "should/may" for critical behaviors unless intentionally optional.
  - term: EARS
    definition: Easy Approach to Requirements Syntax — patterned requirement sentences using WHEN, WHILE, IF/THEN, WHERE, or ubiquitous form so triggers and responses are explicit.
  - term: WHEN (EARS)
    definition: Event-driven requirement — WHEN a trigger occurs, the system shall respond.
  - term: WHILE (EARS)
    definition: State-driven requirement — WHILE a condition/state holds, the system shall maintain a behavior.
  - term: IF/THEN (EARS)
    definition: Unwanted-condition requirement — IF something goes wrong or is illegal, THEN the system shall handle it.
  - term: WHERE (EARS)
    definition: Optional-feature requirement — WHERE a feature is included, the system shall provide related behavior.
  - term: Acceptance criterion (AC)
    definition: >
      Objective check that a requirement is met (often Given/When/Then). ACs prove the shall;
      they do not redefine it. If you need the AC to understand the requirement, the requirement
      is incomplete — fix the FR (especially when requirements are contractual).
  - term: AC–requirement alignment
    definition: >
      Every AC obligation must already be in the FR (no-extra), and every FR obligation must be
      exercised by some AC (cover). When FR and AC conflict, the requirement baseline wins until
      changed under control.
  - term: NFR
    definition: Non-functional requirement — quality attributes such as security, performance, usability, maintainability.
  - term: System boundary
    definition: What is inside the system under design versus external systems and users.
  - term: Interface
    definition: A shared boundary where information, energy, or material is exchanged.
  - term: ICD
    definition: Interface Control Document — agreement on what crosses an interface (format, timing, errors).
  - term: Verification
    definition: Confirm the product was built correctly against requirements/design ("Did we build it right?").
  - term: Validation
    definition: Confirm the product meets the operational need ("Did we build the right thing?").
  - term: Traceability
    definition: Ability to follow a requirement to design elements and tests (and back).
  - term: RTM
    definition: Requirements Traceability Matrix.
  - term: Baseline
    definition: An approved set of artifacts at a point in time under change control.
  - term: CONOPS
    definition: Concept of Operations — describes how a system is used; defines users, missions, and operational concepts; bridges needs/requirements and design.
  - term: AOC
    definition: Air Operations Center — hub for air planning, monitoring, and direction between higher HQ and executing forces.
  - term: COP
    definition: Common Operational Picture — shared situational awareness display of the battlespace.
  - term: TEWA
    definition: Threat Evaluation and Weapon Assignment — process/system function to prioritize threats and assign responses.
  - term: VCS
    definition: Voice Communication System — integrated radios/telephone/VoIP (e.g. training context Frequentis) for mission voice, often with recording and redundancy.
  - term: Link 16
    definition: Tactical datalink used to exchange digital tactical data among platforms (training-level mention; details are procedural/technical beyond this course).
  - term: ATO
    definition: Air Tasking Order — the plan that assigns air missions, resources, and timing for a period of operations.
  - term: Planning (air ops)
    definition: Building missions — objectives, assets, weapons, tankers, routes, comms, timing — before execution.
  - term: Execution (air ops)
    definition: Flying and controlling the plan — launch, monitor, re-task, recover, assess.
  - term: Datalink
    definition: Digital exchange of tactical data between platforms (as opposed to voice radio only).
  - term: Case study (ETAS)
    definition: SDC Time Tracker — living example system used to teach SE with real artifacts.
  - term: UAE Armed Forces
    definition: Federal armed forces of the United Arab Emirates (Army, Navy, Air Force, Presidential Guard, and other public components). Training material is open-source only.
  - term: UAEAF
    definition: United Arab Emirates Air Force — public inventories commonly cite F-16E/F Block 60 and Mirage 2000-9 among other types.
  - term: Ministry of Defence (UAE)
    definition: Federal ministry overseeing defence policy and the armed forces; leadership titles change — verify on official UAE sources before briefing names.
  - term: EDGE Group
    definition: UAE defence and advanced technology group (public industry stakeholder); appears in open sources as a national defence-industry cluster.
  - term: F-16E/F Block 60 (Desert Falcon)
    definition: Advanced F-16 variant publicly associated with UAEAF; use for unclassified mission-card vocabulary only.
  - term: Patriot (MIM-104)
    definition: U.S. surface-to-air / missile-defense family; open sources report UAE PAC-2/PAC-3 employment themes for training vocabulary only.
  - term: THAAD
    definition: Terminal High Altitude Area Defense — U.S. upper-tier BMD; open sources report UAE as an early export customer.
  - term: SHORAD
    definition: Short-Range Air Defence — point/low-altitude defence against aircraft, helicopters, cruise missiles, rockets, and UAVs; sits below long-range SAMs and BMD in a layered architecture.
  - term: Pantsir-S1
    definition: Russian SHORAD family (missile + gun concept); open sources identify the UAE as a launch customer — training vocabulary only, no classified employment data.
  - term: Layered air defence
    definition: Multiple AD tiers (e.g. THAAD, Patriot, medium SAM, SHORAD, C-UAS) that must exchange tracks and cues — a system-of-systems problem for SE interfaces and CONOPS.
  - term: AN/TPY-2
    definition: U.S. X-band transportable radar that serves as the primary sensor for THAAD; open sources associate it with UAE THAAD batteries — training vocabulary only.
  - term: Ground Master (GM400 / GM403)
    definition: Thales long-range 3D AESA air-surveillance radar family; GM-403-class systems appear in open UAE air-picture discussions.
  - term: Giraffe / Sea Giraffe
    definition: Saab multi-mission 3D radar family (land and naval variants); open lists associate Sea Giraffe variants with UAE naval inventories.
  - term: Volume-search radar
    definition: Wide-area air surveillance radar that builds the broad air picture (COP feed); distinct from fire-control radars that support engagement.
  - term: Fire-control radar
    definition: Engagement-quality sensor tied to a weapon system (e.g. Patriot, THAAD/TPY-2 modes, SHORAD organic radar) — different ICD rates and consumers than volume search.
  - term: OV-1
    definition: >
      High-level operational concept graphic (DoDAF-style) showing missions, major players,
      sensors, effectors, and information flows in one picture — used before detailed
      requirements; the course training OV-1 ties UAE open-source AD/radar vocabulary to SE.
  - term: K9 Thunder
    definition: South Korean 155 mm self-propelled howitzer family; appears in open regional cooperation/production reporting — training vocabulary only.
  - term: Leclerc
    definition: French main battle tank widely reported in open UAE Army equipment lists.
  - term: Naqib
    definition: UAE officer rank approximately equivalent to Captain (company grade — bars, not stars, in the course teaching model).
